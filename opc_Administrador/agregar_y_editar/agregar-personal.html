<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agua - Registrar Usuario</title>
    
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/configurar_tarifas.css">
    <link rel="stylesheet" href="/css/update.css">
    <link rel="stylesheet" href="estilos_usuario.css">
    
</head>
<body>

    <header> 
        <h1>TU SISTEMA DE AGUA CONFIABLE</h1>
        <nav>
            <a href="../../opc_Administrador/Comunidades_adm.html">Comunidades</a>
            <a href="../../opc_Administrador/pagos_adm.html">pagos</a>
            <a href="../../opc_Administrador/tipo_servicio_adm.html">Tipo servicio</a>
            <a href="../../opc_Administrador/tipos_descuento_adm.html">Tipo descuentos</a>
            <a href="../../opc_Administrador/resagados_adm.html">Resagados</a>
            <a href="../../opc_Administrador/menu-admin.html">inicio</a>
            <a href="../../opc_Administrador/usuarios.html">Usuarios</a>
            
        </nav> 
    </header>

    <div class="form-container">
        <div class="header-green">
            <h2>Registrar Nuevo Usuario</h2>
        </div>
        
        <form id="formUsuario">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required placeholder="Ingresa el nombre del usuario: Ejemplo: Miguel">
            </div>

            <div class="form-group">
                <label for="apellido_paterno">Apellido Paterno:</label>
                <input type="text" id="apellido_paterno" required placeholder="Ingresa el apellido paterno de usuario">
            </div>

            <div class="form-group">
                <label for="apellido_materno">Apellido Materno:</label>
                <input type="text" id="apellido_materno" placeholder="Ingresa el apellido materno del usuario">
            </div>

            <div class="form-group">
                <label for="usuario">Nombre de Usuario:</label>
                <input type="text" id="usuario" required placeholder="Ej. alberto_miguel">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Mínimo 5 caracteres">
            </div>

            <div class="form-group">
                <label for="rol">Rol del Usuario:</label>
                <select id="rol" required>
                    <option value="1">Administrador (1)</option>
                    <option value="2">Empleado / Operador (2)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="estado">Estado:</label>
                <select id="estado" required>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Guardar Usuario</button>
        </form>
    </div>

    <script src="../../opc_Administrador/javasrip-editar_y_agregar_opc_admin/agreagar-personal.js"></script>
</body>
</html>
