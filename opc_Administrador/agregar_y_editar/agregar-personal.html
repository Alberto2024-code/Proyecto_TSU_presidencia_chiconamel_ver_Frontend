<head>

    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/configurar_tarifas.css">
    <link rel="stylesheet" href="/css/update.css">
    <link rel="stylesheet" href="estilos_usuario.css">
    
</head>
<body>

    <header> 
        <h1>TU SISTEMA DE AGUA CONFIABLE</h1>
        <nav>
            <a href="../../opc_Administrador/Comunidades_adm.html"> Comunidades</a>
        <a href="../../opc_Administrador/tipo_corte_adm.html">pagos</a>
        <a href="../../opc_Administrador/tipo_servicio_adm.html">Tipo servicio</a>
        <a href="../../opc_Administrador/tipos_descuento_adm.html">Tipo descuentos</a>

        <a href="../../opc_Administrador/menu-admin.html">inicio</a>
        <a href="../../opc_Administrador/usuarios.html">Usuarios</a>
            
        </nav> 
    </header>

    <div class="form-container">
        <div class="header-green">
            <h2>Registrar Nuevo Usuario</h2>
        </div>
        
        <form id="formUsuario">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input style="text-transform: uppercase;" id="nombre" required placeholder="Ingresa el nombre del usuario: Ejemplo: Miguel" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <div class="form-group">
                <label for="apellido_paterno">Apellido Paterno:</label>
                <input style="text-transform: uppercase;" id="apellido_paterno" required placeholder="Ingresa el apellido paterno de usuario" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <div class="form-group">
                <label for="apellido_materno">Apellido Materno:</label>
                <input style="text-transform: uppercase;" id="apellido_materno" placeholder="Ingresa el apellido materno del usuario" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <div class="form-group">
                <label for="usuario">Nombre de Usuario:</label>
                <input style="text-transform: uppercase;" id="usuario" required placeholder="Ej. alberto_miguel" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <label>Contraseña</label>
            <div class="password-container">
            <input type="password" id="input-password" placeholder="Ingresa tu contraseña" required>
            <button type="button" id="btn-toggle-password" class="toggle-eye-btn">👁️</button>
            </div>

            <div class="form-group">
                <label for="rol">Rol del Usuario:</label>
                <select id="rol" required>
                    <option value="2">Empleado</option>
                </select>
            </div>

            <div class="form-group">
                <label for="estado">Estado:</label>
                <select id="estado" required>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Guardar Usuario</button>
        </form>
    </div>
    <script src="../js/bootstrap.bundle.min.js"></script>
    
    <script src="../../opc_Administrador/javasrip-editar_y_agregar_opc_admin/agreagar-personal.js"></script>
</body>
</html>
