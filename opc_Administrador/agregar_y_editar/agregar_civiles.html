<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

     <link rel="stylesheet" href="../../css/bootstrap.min.css"> 
    
    <link rel="stylesheet" href="../../css/login.css">
    <link rel="stylesheet" href="../../css/configurar_tarifas.css">
    <link rel="stylesheet" href="../../css/update.css">
    
</head>
<body>

    <header> 
        <h1>TU SISTEMA DE AGUA CONFIABLE</h1>
        <nav>
           <a href="../../opc_Administrador/Comunidades_adm.html"> Comunidades</a>
        <a href="../../opc_Administrador/tipo_corte_adm.html">pagos</a>
        <a href="../../opc_Administrador/tipo_servicio_adm.html">Tipo servicio</a>
        <a href="../../opc_Administrador/tipos_descuento_adm.html">Tipo descuentos</a>
        <a href="../../opc_Administrador/resagados_adm.html">Resagados</a>
        <a href="../../opc_Administrador/menu-admin.html">inicio</a>
        <a href="../../opc_Administrador/usuarios.html">Usuarios</a>
          
        </nav> 
    </header>

    <div class="form-container">
        <div class="header-green">
            <h2>Registrar Nuevo CIVIL</h2>
        </div>
        
        <form id="formUsuario">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input  style="text-transform: uppercase;" id="nombre" required placeholder="Ingresa el nombre del civil" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras" > 
            </div>

            <div class="form-group">
                <label for="apellido_paterno">Apellido Paterno:</label>
                <input style="text-transform: uppercase;" id="apellido_paterno" required placeholder="Ingresa el apellido paterno del civil" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <div class="form-group">
                <label for="apellido_materno">Apellido Materno:</label>
                <input style="text-transform: uppercase;" id="apellido_materno" placeholder="Ingresa el apellido materno del civil"pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <div class="form-group">
                <label for="comunidad">Selecciona su comunidad:</label>
                <select id="comunidad" required>
                <option value="">Cargando comunidades...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="domicilio">Selecciona el domicilio:</label>
                <select id="domicilio" required>
                <option value="">Cargando calles...</option>
                 </select>
            </div>

            <div class="form-group">
                <label for="cuenta-no">Ingresa un numero de cuenta no igual a uno ya creado:</label>
                <input type="number" id="cuenta-no" required placeholder="INGRESA UN NUMERO NO REPETIDO">
            </div>
            <div class="form-group">
                <label for="tipo_servicio">Tipo servicio:</label>
                <select id="tipo-servicio" required>
                    <option value="1">Domestico</option>
                    <option value="2">Comercial</option>
                    <option value="3">Domestico_2</option>
                </select>
            </div>
             <div class="form-group">
                <label for="Estado">Estado:</label>
                <select id="estado" required>
                    <option value="1">Activo</option>
                    <option value="2">Innactivo</option>
                </select>
            </div>
            
            

            
            <button type="submit" class="btn-submit">Guardar Usuario</button>
        </form>
    </div>
    <script src="../js/bootstrap.bundle.min.js"></script>
    
    <script src="../../opc_Administrador/javasrip-editar_y_agregar_opc_admin/agregar-civiles.js"></script>
</body>
</html>
