    <h1 id="encabezado-formulario">ACTUALIZAR DATOS DE USUARIO</h1>

    <a href="../usuarios.html" class="logout-btn">
        <span class="logout-icon">Volver a atrás</span> 
    </a>

    <div class="formulario-contenedor">
        <form id="form-usuario">
            
            <div class="grupo-formulario">
                <label for="nombre">Nombre:</label>
                <input style="text-transform: uppercase;" id="nombre" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <div class="grupo-formulario">
                <label for="apellido-paterno">Apellido Paterno:</label>
                <input style="text-transform: uppercase;" id="apellido-paterno" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <div class="grupo-formulario">
                <label for="apellido-materno">Apellido Materno:</label>
                <input style="text-transform: uppercase;" id="apellido-materno" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>

            <div class="grupo-formulario">
                <label for="usuario">Nombre de Usuario :</label>
                <input style="text-transform: uppercase;" id="usuario" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="solo se permiten letras">
            </div>

            <div class="grupo-formulario">
                <label for="rol">Rol del Usuario:</label>
                <select id="rol" required>
                    <option value="1">Administrador </option>
                    <option value="2">Empleado </option>
                </select>
            </div>

            <div class="grupo-formulario">
                <label for="estado">Estado:</label>
                <select id="estado" required>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>

            <button type="submit" id="btn-guardar" class="btn-formulario-guardar">
                Actualizar Cambios
            </button>
        </form>
    </div>
    
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../javasrip-editar_y_agregar_opc_admin/Update-Personal.js"></script>
