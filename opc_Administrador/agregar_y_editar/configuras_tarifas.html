<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/comunidades.css">
    <link rel="stylesheet" href="/css/Personal.css">
    <link rel="stylesheet" href="/css/configurar_tarifas.css">
    <title>CONFIGURAR TARIFAS Y MULTAS</title>
</head>
<body>

    <header> 
        <h1>TU SISTEMA DE AGUA CONFIABLE</h1>
        <nav>
            <a href="../opc_Administrador/Comunidades_adm.html"> Comunidades</a>
            <a href="../opc_Administrador/pagos_adm.html">pagos</a>
            <a href="../opc_Administrador/tipo_servicio_adm.html">Tipo servicio</a>
            <a href="../opc_Administrador/tipos_descuento_adm.html">Tipo descuentos</a>
            <a href="../opc_Administrador/resagados_adm.html">Resagados</a>
            <a href="../opc_Administrador/menu-admin.html">inicio</a>
            <a href="../opc_Administrador/usuarios.html">Usuarios</a>
        </nav> 
    </header>

    <main class="contenedor-principal">
        <div class="contenedor-formulario-tarifas">
            <div class="titulo-formulario">GESTOR DE PRECIOS ANUALES</div>
            
            <form id="form-tarifas">
                
                <div class="grupo-campo">
                    <label for="tipo_servicio">Tipo de Servicio a configurar:</label>
                    <select id="tipo_servicio" name="tipo_servicio" required>
                        <option value="Domestico">Doméstico</option>
                        <option value="Comercial">Comercial</option>
                    </select>
                </div>

                <div class="fila-doble">
                    <div class="grupo-campo">
                        <label for="anio">Año Correspondiente:</label>
                        <input type="number" id="anio" name="anio" value="2026" required>
                    </div>
                    <div class="grupo-campo">
                        <label for="monto">Monto Base Mensual:</label>
                        <input type="number" step="0.01" id="monto" name="monto" placeholder="Ej. 60.00" required>
                    </div>
                </div>

                <div class="subtitulo-bloque">Descuentos y Promociones</div>

                <div class="fila-doble">
                    <div class="grupo-campo">
                        <label for="monto_descuento">Monto Descuento:</label>
                        <input type="number" step="0.01" id="monto_descuento" name="monto_descuento" value="0.00">
                    </div>
                    <div class="grupo-campo">
                        <label for="porcentaje">Porcentaje Descuento:</label>
                        <input type="number" id="porcentaje" name="porcentaje" value="0" min="0" max="100">
                    </div>
                </div>

                <div class="grupo-campo">
                    <label for="promocion_name">Nombre de la Promoción:</label>
                    <input type="text" id="promocion_name" name="promocion_name" placeholder="Ej. Descuento INAPAM">
                </div>

                <div class="fila-doble">
                    <div class="grupo-campo">
                        <label for="fecha_inicio">Fecha Inicio Promoción:</label>
                        <input type="date" id="fecha_inicio" name="fecha_inicio">
                    </div>
                    <div class="grupo-campo">
                        <label for="fecha_termino">Fecha Término Promoción:</label>
                        <input type="date" id="fecha_termino" name="fecha_termino">
                    </div>
                </div>

                <div class="subtitulo-bloque alerta">Penalizaciones y Recargos</div>
                
                <div class="grupo-campo">
                    <label for="monto_multa">Monto de Multa por Retraso:</label>
                    <input type="number" step="0.01" id="monto_multa" name="monto_multa" placeholder="Ej. 50.00" value="0.00" required>
                </div>

                <div class="botones-accion">
                    <a href="../opc_Administrador/tipo_servicio_adm.html" class="btn-cancelar">Volver</a>
                    <button type="submit" class="btn-guardar">GUARDAR CONFIGURACIÓN</button>
                </div>

            </form>
        </div>
    </main>

    <script src="../JavaScrip/configurar_tarifas.js"></script>
</body>
</html>
