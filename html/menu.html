    <script>
        // 🛡️ CONTROL DE ACCESO PROFESIONAL
        const tokenValido = localStorage.getItem('token');
        
        // Si el token no existe, es null, es "undefined" o está vacío
        if (!tokenValido || tokenValido === "undefined" || tokenValido === "") {
            
            // Limpiamos cualquier rastro por si acaso
            localStorage.removeItem('token');
            localStorage.removeItem('usuario');
            
            alert('¡Acceso denegado! Primero debes iniciar sesión.');
            
            // Intentamos redirigir de forma local o un nivel atrás si es necesario
            // Esto asegura que encuentre el archivo login.html sí o sí
            if (window.location.pathname.includes('/html/')) {
                window.location.replace("login.html");
            } else {
                window.location.replace("login.html"); 
            }
        }
    </script>
